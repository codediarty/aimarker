<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>인터넷 연결이 끊겼어요 | AIMarker</title>
<meta name="robots" content="noindex"><meta name="theme-color" content="#FFFFFF"><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#0B1733;--slate:#4B566F;--mist:#66718A;--line:#E3E7EE;--blue:#0B63F6;--bg:#F6F8FB}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;word-break:keep-all}
.c{width:100%;max-width:420px;padding:28px 24px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 12px 32px -12px rgba(11,23,51,.16)}
img{width:56px;height:56px;border-radius:14px}h1{margin:16px 0 0;font-size:22px;letter-spacing:-.03em}p{margin:8px 0 0;font-size:15px;line-height:1.65;color:var(--slate)}
button{width:100%;height:50px;margin-top:20px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
h2{margin:22px 0 6px;font-size:14px;color:var(--mist)}ul{margin:0;padding:0;list-style:none}li a{display:block;padding:10px 2px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:15px}
</style></head><body><main class="c">
<img src="../assets/icon-192.png" alt="">
<h1>인터넷 연결이 끊겼어요</h1>
<p>연결되면 바로 이어서 쓸 수 있습니다. 검사 · 휴머나이징 · 진단처럼 서버가 필요한 기능은 연결된 뒤에 됩니다.</p>
<button type="button" onclick="location.reload()">다시 시도</button>
<h2 id="t" hidden>이 기기에 남아 있는 페이지</h2><ul id="l"></ul>
</main>
<script>
(function(){if(!('caches'in window))return;caches.open('am-page').then(function(c){return c.keys()}).then(function(ks){var l=document.getElementById('l'),n=0;ks.slice(-12).reverse().forEach(function(k){var u=new URL(k.url);if(u.pathname.indexOf('/offline/')===0)return;var a=document.createElement('a');a.href=u.pathname;a.textContent=decodeURIComponent(u.pathname)==='/'?'첫 화면':decodeURIComponent(u.pathname);var li=document.createElement('li');li.appendChild(a);l.appendChild(li);n++});if(n)document.getElementById('t').hidden=false}).catch(function(){});window.addEventListener('online',function(){location.reload()})})();
</script>
<!-- 판 20261027f -->
</body></html>
